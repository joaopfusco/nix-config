name: flake-update

on:
  schedule:
    # Sábado 09:00 America/Sao_Paulo
    - cron: "0 12 * * 6"
  workflow_dispatch:

env:
  UPDATE_BRANCH: flake-update

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Reset update branch from main
        run: |
          git fetch origin main
          git checkout -B "$UPDATE_BRANCH" origin/main

      - name: Update flake inputs
        run: nix flake update

      - id: diff
        name: Check for changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock"
          git push --force origin "$UPDATE_BRANCH"

      - name: Open PR if needed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: update flake.lock" \
              --body "Atualização automática semanal dos inputs do flake."
          fi

  discover:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flake-update

      - id: matrix
        name: Build host/runner matrix from home/
        run: |
          declare -A RUNNERS=(
            [x86_64-linux]=ubuntu-latest
            [aarch64-darwin]=macos-latest
          )
          include="[]"
          for dir in home/*/; do
            profile="$(basename "$dir")"
            if [ -f "${dir}system" ]; then
              system="$(tr -d ' \n' < "${dir}system")"
            else
              system="x86_64-linux"
            fi
            runner="${RUNNERS[$system]:-}"
            if [ -z "$runner" ]; then
              echo "::error::sistema não mapeado para o perfil '${profile}': ${system}"
              exit 1
            fi
            include="$(jq --arg profile "$profile" --arg runner "$runner" '. + [{"profile": $profile, "runner": $runner}]' <<< "$include")"
          done
          echo "matrix=$(jq -c --argjson include "$include" -n '{include: $include}')" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flake-update

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Build homeConfigurations.joaop@${{ matrix.profile }}
        run: nix build --no-link ".#homeConfigurations.\"joaop@${{ matrix.profile }}\".activationPackage"

  merge:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$UPDATE_BRANCH" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --subject "chore: update flake.lock"
